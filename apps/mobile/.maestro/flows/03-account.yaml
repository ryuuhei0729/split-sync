# アカウント画面（プラン機能一覧）
# ゲストモードのホームにはアカウント導線が無い（ログイン時のみチップ表示）ため、
# ディープリンク swimhubtimer://account で直接開く。ゲストでもプラン別機能一覧が表示される。
# 必要な env: APP_ID, LOCALE, REGION, OUTPUT_DIR, DEVICE_TAG
appId: ${APP_ID}
---
- runFlow: ../subflows/launch.yaml
- openLink: swimhubtimer://account
# iOS のカスタムスキーム確認ダイアログ「"SH Timer" で開きますか?」が初回だけ出る。
# 出たら「開く」で確定（OS 言語依存のため多言語対応、2回目以降は出ないので optional）。
- runFlow:
    when:
      visible:
        text: "開く|Open|열기|打开|打開|Öffnen"
    commands:
      - tapOn:
          text: "開く|Open|열기|打开|打開|Öffnen"
- extendedWaitUntil:
    visible:
      id: "account-screen"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUTPUT_DIR}/${DEVICE_TAG}_03_account
